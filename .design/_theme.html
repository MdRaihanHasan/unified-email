<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent); text-decoration: underline; }
    * { box-sizing: border-box; }

    .app {
      --bg: oklch(98.5% .001 106.423);
      --panel: #ffffff;
      --panel-2: oklch(97% .001 106.424);
      --line: oklch(92.3% .003 48.717);
      --ink: oklch(21.6% .006 56.043);
      --ink-2: oklch(44.4% .011 73.639);
      --ink-3: oklch(70.9% .01 56.259);
      --accent: oklch(58.8% .158 241.966);
      --accent-soft: oklch(96.5% .022 240);
      --star: oklch(76.9% .188 70.08);
      --hover: oklch(97% .001 106.424);
      --sel: oklch(96.5% .022 240);
      --shadow: 0 1px 2px oklch(0% 0 0 / .07), 0 10px 28px oklch(0% 0 0 / .10);
      --p-work: oklch(58% .17 25);
      --p-gmail: oklch(62% .15 75);
      --p-outlook: oklch(56% .17 295);
      font-family: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .app.dark {
      --bg: oklch(14.7% .004 49.25);
      --panel: oklch(21.6% .006 56.043);
      --panel-2: oklch(26.8% .007 34.298);
      --line: oklch(26.8% .007 34.298);
      --ink: oklch(97% .001 106.424);
      --ink-2: oklch(70.9% .01 56.259);
      --ink-3: oklch(55.3% .013 58.071);
      --accent: oklch(74.6% .16 232.661);
      --accent-soft: oklch(29.3% .066 243.157);
      --hover: oklch(26.8% .007 34.298);
      --sel: oklch(29.3% .066 243.157);
      --shadow: 0 1px 2px oklch(0% 0 0 / .5), 0 10px 28px oklch(0% 0 0 / .6);
      --p-work: oklch(68% .17 25);
      --p-gmail: oklch(74% .15 75);
      --p-outlook: oklch(68% .17 295);
    }

    .ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .ico-s { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
    .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .iconbtn { display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 999px; color: var(--ink-2); background: none; border: 0; }
    .iconbtn:hover { background: var(--hover); }
  </style>
</helmet>
