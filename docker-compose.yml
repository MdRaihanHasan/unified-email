# Everything runs on one host, and every connection out is ours: the Gmail API,
# and Microsoft Graph once that adapter lands. Nothing needs to reach in, so no
# port is published beyond the app itself and there is no tunnel or static IP
# anywhere in the deployment.
#
#   docker compose up -d --build
#   docker compose exec app php artisan mail:user
#   open http://localhost:8000

x-app: &app
  build:
    context: .
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    # Set here rather than trusted from .env: those hostnames only exist on this
    # network, and a .env copied from a host setup would point at 127.0.0.1.
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_HOST: redis
    REDIS_PORT: 6379
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
  volumes:
    # Shared deliberately: the web container writes staged attachment uploads and
    # the worker reads them when it sends.
    - app-storage:/app/storage/app
    - ./storage/logs:/app/storage/logs
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      <<: *app-env
      # Caddy would otherwise try to provision a certificate for a hostname that
      # does not resolve.
      SERVER_NAME: ":80"
      # Only this container migrates; the worker and scheduler racing on the same
      # migration is how a schema ends up half applied.
      RUN_MIGRATIONS: "true"
    ports:
      # Bound to loopback. On a VPS, reach it over Tailscale or a reverse proxy
      # rather than exposing a personal mailbox to the internet.
      - "127.0.0.1:${APP_PORT:-8000}:80"

  # Backfill pages, body fetches, sends, flag pushes.
  worker:
    <<: *app
    command: php artisan queue:work --tries=3 --timeout=600 --sleep=1 --max-time=3600
    healthcheck:
      disable: true

  # Drives the every-minute delta polls.
  scheduler:
    <<: *app
    command: php artisan schedule:work
    healthcheck:
      disable: true

  # Only for a plain IMAP mailbox. Gmail does not need it — it is polled through
  # the API — so this stays behind a profile:
  #     docker compose --profile idle up -d
  imap-idle:
    <<: *app
    profiles: ["idle"]
    command: php artisan mail:idle ${IDLE_ACCOUNT:-}
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-unified_email}
      POSTGRES_USER: ${DB_USERNAME:-unified}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-unified} -d ${DB_DATABASE:-unified_email}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Queue and cache only. No mail is stored here, so appendonly is convenience
    # rather than safety — a lost queue is re-derivable, a lost mailbox is not.
    command: redis-server --appendonly yes --save ""
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
  app-storage:
