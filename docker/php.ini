; Attachment uploads are validated at 25 MB in ComposeController; PHP's 2 MB
; default would reject them before that rule ever runs.
upload_max_filesize = 30M
post_max_size = 32M

; A backfill page holds a hundred parsed messages with bodies in memory at once.
memory_limit = 512M

; Long enough for a backfill page or a send with attachments.
max_execution_time = 120

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code never changes inside a built image, so skip the stat() per include.
opcache.validate_timestamps = 0

; Email bodies and MIME trees are deep; the default 100 is fine but be explicit.
zend.assertions = -1
